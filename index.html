<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>음성 → 텍스트 → 영어 번역</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", sans-serif;
    background: #f5f6f8; margin: 0; padding: 24px; display: flex; justify-content: center;
  }
  .wrap { width: 100%; max-width: 980px; }
  h1 { font-size: 20px; margin: 0 0 16px; color: #222; }
  .card { background: #fff; border-radius: 12px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,.08); }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; }
  button { border: 0; border-radius: 8px; padding: 10px 18px; font-size: 14px; font-weight: 600; cursor: pointer; }
  #startBtn { background: #2563eb; color: #fff; }
  #startBtn.rec { background: #dc2626; }
  #prepBtn { background: #059669; color: #fff; }
  #prepBtn.ready { background: #d1fae5; color: #065f46; cursor: default; }
  #clearBtn, #copyBtn { background: #e5e7eb; color: #374151; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  select { padding: 9px 10px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 14px; }
  label.chk { font-size: 13px; color: #374151; display: flex; align-items: center; gap: 4px; }
  .panes { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 720px) { .panes { grid-template-columns: 1fr; } }
  .pane h2 { font-size: 13px; color: #6b7280; margin: 0 0 6px; font-weight: 600; }
  .box {
    width: 100%; min-height: 260px; max-height: 420px; overflow-y: auto;
    padding: 14px; border: 1px solid #d1d5db; border-radius: 8px;
    font-size: 15px; line-height: 1.7; background: #fff; white-space: pre-wrap;
  }
  #enBox { background: #f8fafc; }
  .interim { color: #9ca3af; }
  .pending { color: #94a3b8; font-style: italic; }
  #status { font-size: 13px; color: #6b7280; margin-top: 12px; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #dc2626; margin-right: 6px; animation: pulse 1s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .2 } }
  .err  { background: #fef2f2; color: #b91c1c; padding: 12px; border-radius: 8px; font-size: 14px; line-height: 1.6; }
  .warn { background: #fffbeb; color: #92400e; padding: 12px; border-radius: 8px; font-size: 13px; line-height: 1.6; margin-bottom: 14px; }
  .info { background: #eff6ff; color: #1e40af; padding: 12px; border-radius: 8px; font-size: 13px; line-height: 1.6; margin-bottom: 14px; }
  code { background: rgba(0,0,0,.06); padding: 1px 5px; border-radius: 4px; font-size: 12px; }
  .bar { height: 6px; background: #e5e7eb; border-radius: 3px; overflow: hidden; margin-top: 8px; display: none; }
  .bar.on { display: block; }
  .bar > i { display: block; height: 100%; width: 0%; background: #2563eb; transition: width .2s; }
</style>
</head>
<body>
<div class="wrap">
  <h1>마이크 음성 → 텍스트 → 실시간 영어 번역</h1>
  <div class="card">
    <div id="banner"></div>

    <div class="row">
      <button id="prepBtn">⬇ 번역 모델 준비</button>
      <button id="startBtn">● 녹음 시작</button>
      <select id="lang">
        <option value="ko-KR" data-src="ko">한국어</option>
        <option value="ja-JP" data-src="ja">日本語</option>
        <option value="zh-CN" data-src="zh">中文(简体)</option>
        <option value="es-ES" data-src="es">Español</option>
        <option value="fr-FR" data-src="fr">Français</option>
      </select>
      <label class="chk"><input type="checkbox" id="continuous" checked> 연속 인식</label>
      <label class="chk"><input type="checkbox" id="autoTrans" checked> 자동 번역</label>
      <button id="clearBtn">지우기</button>
      <button id="copyBtn">영문 복사</button>
    </div>
    <div class="bar" id="bar"><i></i></div>

    <div class="panes" style="margin-top:14px">
      <div class="pane">
        <h2>원문 (음성 인식)</h2>
        <div id="srcBox" class="box"></div>
      </div>
      <div class="pane">
        <h2>English (번역)</h2>
        <div id="enBox" class="box"></div>
      </div>
    </div>

    <div id="status">대기 중 — 먼저 <b>번역 모델 준비</b> 버튼을 눌러주세요</div>
  </div>
</div>

<script>
(function () {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const $ = (id) => document.getElementById(id);
  const prepBtn=$('prepBtn'), startBtn=$('startBtn'), clearBtn=$('clearBtn'), copyBtn=$('copyBtn');
  const langSel=$('lang'), contChk=$('continuous'), autoChk=$('autoTrans');
  const srcBox=$('srcBox'), enBox=$('enBox'), status=$('status'), banner=$('banner');
  const bar=$('bar'), barFill=bar.firstElementChild;

  if (!SR) {
    document.querySelector('.card').innerHTML =
      '<div class="err">이 브라우저는 Web Speech API를 지원하지 않습니다.<br>Chrome 또는 Edge 최신 버전에서 열어주세요.</div>';
    return;
  }
  const hasTranslator = 'Translator' in self;
  if (!hasTranslator) {
    prepBtn.disabled = true;
    banner.innerHTML =
      '<div class="warn"><b>내장 번역기(Translator API) 미지원</b><br>' +
      'Chrome 138+ 가 필요합니다. <code>chrome://flags/#translation-api</code> 를 Enabled 로 바꾼 뒤 재시작하세요. ' +
      '음성 인식(원문)은 그대로 동작합니다.</div>';
  } else {
    banner.innerHTML =
      '<div class="info">번역 모델은 <b>최초 1회 다운로드</b>가 필요하며, 브라우저 정책상 ' +
      '<b>버튼 클릭(사용자 제스처) 직후에만</b> 받을 수 있습니다. 위 <b>번역 모델 준비</b> 버튼을 먼저 눌러주세요.</div>';
  }

  /* ========== 번역기 상태 관리 ========== */
  let translator = null;         // 준비된 Translator 인스턴스
  let translatorLang = null;     // 그 인스턴스의 소스 언어
  let preparing = null;          // 준비 중인 Promise (중복 클릭 방지)

  const srcLang = () => langSel.selectedOptions[0].dataset.src;

  function setPrepUI(state, text) {
    // state: 'idle' | 'loading' | 'ready'
    prepBtn.classList.toggle('ready', state === 'ready');
    prepBtn.disabled = (state !== 'idle');
    prepBtn.textContent =
      state === 'ready'   ? '✓ 번역 모델 준비됨 (' + srcLang() + '→en)' :
      state === 'loading' ? '다운로드 중…' : '⬇ 번역 모델 준비';
    if (text) status.textContent = text;
    bar.classList.toggle('on', state === 'loading');
  }

  /**
   * 핵심: 반드시 사용자 제스처 핸들러의 '동기 구간'에서 호출할 것.
   * availability() 를 먼저 await 하면 transient activation 이 소모/만료되어
   * "Requires a user gesture..." 오류가 재발한다. 따라서 create() 를 즉시 호출한다.
   */
  function prepareTranslatorNow() {
    if (!hasTranslator) return Promise.resolve(null);
    if (translator && translatorLang === srcLang()) return Promise.resolve(translator);
    if (preparing) return preparing;

    const lang = srcLang();
    setPrepUI('loading');
    barFill.style.width = '0%';

    // create() 를 await 없이 '즉시' 호출 — 제스처 컨텍스트 유지
    preparing = Translator.create({
      sourceLanguage: lang,
      targetLanguage: 'en',
      monitor(m) {
        m.addEventListener('downloadprogress', (e) => {
          const pct = Math.round((e.loaded || 0) * 100);
          barFill.style.width = pct + '%';
          status.textContent = `번역 모델 다운로드 ${pct}%`;
        });
      }
    }).then((t) => {
      if (translator?.destroy && translator !== t) translator.destroy();
      translator = t;
      translatorLang = lang;
      preparing = null;
      setPrepUI('ready', `번역기 준비 완료 (${lang} → en)`);
      pump();                       // 보류됐던 문장 일괄 번역
      return t;
    }).catch((err) => {
      preparing = null;
      translator = null; translatorLang = null;
      setPrepUI('idle');
      const msg = /user gesture/i.test(err.message)
        ? '모델 다운로드는 버튼 클릭 직후에만 가능합니다. 「번역 모델 준비」 버튼을 다시 눌러주세요.'
        : /unavailable|not supported/i.test(err.message)
          ? `${lang} → en 번역 모델을 이 기기에서 사용할 수 없습니다.`
          : '번역기 초기화 실패: ' + err.message;
      status.textContent = msg;
      return null;
    });

    return preparing;
  }

  /* ========== 문장 큐 ========== */
  const segments = [];
  let queue = [], working = false;

  function enqueue(i) { queue.push(i); pump(); }

  async function pump() {
    if (working || !queue.length) return;

    // 번역기가 아직 없으면: 다운로드를 시도하지 않고 '보류' 상태로 대기
    if (!translator || translatorLang !== srcLang()) {
      queue.forEach(i => { segments[i].state = 'hold'; });
      render();
      if (hasTranslator && !preparing) {
        status.textContent = '번역 대기 중 — 「번역 모델 준비」 버튼을 눌러주세요';
        setPrepUI('idle');
      }
      return;
    }

    working = true;
    const seg = segments[queue.shift()];
    try {
      seg.en = await translator.translate(seg.src);
      seg.state = 'done';
    } catch (err) {
      seg.en = '(번역 오류: ' + err.message + ')';
      seg.state = 'fail';
    }
    render();
    working = false;
    pump();
  }

  /* ========== 렌더 ========== */
  let interimText = '';
  const esc = (s) => (s||'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

  function render() {
    srcBox.innerHTML = segments.map(s => esc(s.src)).join(' ') +
      (interimText ? ' <span class="interim">' + esc(interimText) + '</span>' : '');
    enBox.innerHTML = segments.map(s => {
      if (s.state === 'done') return esc(s.en);
      const label = s.state === 'hold' ? '[번역 대기]' : s.state === 'fail' ? esc(s.en) : '번역 중…';
      return '<span class="pending">' + label + '</span>';
    }).join(' ');
    srcBox.scrollTop = srcBox.scrollHeight;
    enBox.scrollTop = enBox.scrollHeight;
  }

  /* ========== 음성 인식 ========== */
  let recog = null, recording = false, manualStop = false;

  function buildRecognition() {
    const r = new SR();
    r.lang = langSel.value;
    r.continuous = contChk.checked;
    r.interimResults = true;
    r.maxAlternatives = 1;

    r.onstart = () => {
      recording = true;
      startBtn.textContent = '■ 녹음 중지';
      startBtn.classList.add('rec');
      status.innerHTML = '<span class="dot"></span>듣고 있습니다…';
    };

    r.onresult = (e) => {
      let interim = '';
      for (let i = e.resultIndex; i < e.results.length; i++) {
        const txt = e.results[i][0].transcript.trim();
        if (!txt) continue;
        if (e.results[i].isFinal) {
          segments.push({ src: txt, en: '', state: 'pending' });
          if (autoChk.checked) enqueue(segments.length - 1);
        } else interim += txt;
      }
      interimText = interim;
      render();
    };

    r.onerror = (e) => {
      status.textContent = {
        'not-allowed': '마이크 권한이 거부되었습니다.',
        'no-speech': '음성이 감지되지 않았습니다.',
        'audio-capture': '마이크를 찾을 수 없습니다.',
        'network': '네트워크 오류가 발생했습니다.'
      }[e.error] || ('오류: ' + e.error);
    };

    r.onend = () => {
      if (recording && !manualStop && contChk.checked) {
        try { r.start(); return; } catch (_) {}
      }
      recording = false; interimText = ''; render();
      startBtn.textContent = '● 녹음 시작';
      startBtn.classList.remove('rec');
      status.textContent = '중지됨';
    };
    return r;
  }

  /* ========== 이벤트 ========== */
  // 이 클릭이 유일한 '다운로드 허용 창'
  prepBtn.addEventListener('click', () => { prepareTranslatorNow(); });

  startBtn.addEventListener('click', () => {
    if (recording) { manualStop = true; recog.stop(); return; }

    // 녹음 시작 클릭도 사용자 제스처이므로, 이 시점에 모델 준비를 같이 트리거
    if (hasTranslator && autoChk.checked && (!translator || translatorLang !== srcLang())) {
      prepareTranslatorNow();   // await 하지 않음 — 제스처 컨텍스트 보존
    }
    manualStop = false;
    recog = buildRecognition();
    try { recog.start(); } catch (err) { status.textContent = '시작 실패: ' + err.message; }
  });

  clearBtn.addEventListener('click', () => {
    segments.length = 0; queue.length = 0; interimText = '';
    render(); status.textContent = '지웠습니다';
  });

  copyBtn.addEventListener('click', async () => {
    const text = segments.filter(s => s.state === 'done').map(s => s.en).join(' ');
    if (!text) return;
    try { await navigator.clipboard.writeText(text); status.textContent = '영문을 복사했습니다'; }
    catch (_) { status.textContent = '복사 실패'; }
  });

  langSel.addEventListener('change', () => {
    if (recording) { manualStop = true; recog.stop(); }
    translator = null; translatorLang = null; preparing = null;
    setPrepUI('idle', '언어 변경됨 — 「번역 모델 준비」 를 다시 눌러주세요');
    // 미번역 문장은 보류로 되돌림
    segments.forEach((s, i) => { if (s.state !== 'done') s.state = 'hold'; });
    render();
  });

  // 이미 받아둔 모델이면 제스처 없이도 쓸 수 있으므로, availability 만 조용히 확인
  if (hasTranslator) {
    Translator.availability({ sourceLanguage: srcLang(), targetLanguage: 'en' })
      .then(a => {
        if (a === 'available') {
          // 이미 설치됨 → 다운로드 불필요하므로 제스처 없이 create 가능
          return Translator.create({ sourceLanguage: srcLang(), targetLanguage: 'en' })
            .then(t => { translator = t; translatorLang = srcLang();
                         setPrepUI('ready', '번역기 준비 완료 (설치된 모델 사용)'); });
        }
        if (a === 'unavailable') { prepBtn.disabled = true; status.textContent = '이 언어쌍은 지원되지 않습니다.'; }
      })
      .catch(() => {});
  }
})();
</script>
